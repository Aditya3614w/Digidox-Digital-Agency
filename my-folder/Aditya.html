
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a question for you</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --paper: #fdf6f3;
    --ink: #3a2b2f;
    --blush: #f4a9b8;
    --rose: #e6708a;
    --deep: #c14a68;
    --soft: #fbe4e6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background:
      radial-gradient(circle at 20% 15%, #fce8ec 0%, transparent 45%),
      radial-gradient(circle at 82% 80%, #fbe0d6 0%, transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    background: rgba(255, 255, 255, 0.62);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(230, 112, 138, 0.22);
    border-radius: 28px;
    padding: 46px 34px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px -28px rgba(193, 74, 104, 0.45);
    position: relative;
    z-index: 2;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 18px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 6vw, 2.7rem);
    line-height: 1.12;
    margin-bottom: 14px;
  }
  h1 em { color: var(--deep); font-style: italic; }

  .sub {
    font-size: 1rem;
    color: #7a5c63;
    margin-bottom: 30px;
    min-height: 1.4em;
  }

  .progress { display: flex; gap: 7px; justify-content: center; margin-bottom: 28px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--soft); transition: all 0.4s ease; }
  .dot.active { background: var(--rose); transform: scale(1.35); }
  .dot.done { background: var(--blush); }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--soft);
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  .btn-yes:hover, .btn-yes:focus-visible {
    transform: translateY(-2px);
    border-color: var(--rose);
    background: var(--soft);
    outline: none;
    box-shadow: 0 10px 24px -14px rgba(193, 74, 104, 0.6);
  }

  .no-wrap { position: relative; height: 54px; }
  .btn-no {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    transition: all 0.22s ease;
    background: #fff;
    color: #b98a92;
    border-color: #f0dde0;
  }

  .finale h1 { font-size: clamp(2.1rem, 7vw, 3rem); }
  .finale .note {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--deep);
    line-height: 1.55;
    margin: 8px auto 26px;
    max-width: 340px;
  }
  .heart-big {
    font-size: 3.4rem;
    display: inline-block;
    margin-bottom: 10px;
    animation: beat 1.1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    18% { transform: scale(1.18); }
    36% { transform: scale(1); }
    54% { transform: scale(1.12); }
  }

  .replay {
    background: none; border: none;
    color: var(--rose);
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: pointer; margin-top: 6px;
  }
  .replay:hover { color: var(--deep); }

  .float-heart {
    position: fixed; bottom: -40px;
    font-size: 1.6rem; pointer-events: none;
    z-index: 1; animation: rise linear forwards;
  }
  @keyframes rise { to { transform: translateY(-110vh) rotate(40deg); opacity: 0; } }

  .fade-in { animation: fade 0.5s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .heart-big, .float-heart, .fade-in { animation: none; }
  }
</style>
</head>
<body>
  <div class="card" id="card"></div>

<script>
const questions = [
  { eyebrow: "question one of three", title: 'Do you <em>love</em> me?', sub: "be honest now \u{1F440}" },
  { eyebrow: "question two of three", title: 'Am I your <em>favorite</em> person?', sub: "there's a right answer here" },
  { eyebrow: "final question", title: 'Do you want <em>forever</em> with me?', sub: "no pressure or anything \u{1F97A}" }
];

let step = 0;
const card = document.getElementById('card');

function dots() {
  return '<div class="progress">' + questions.map(function(_, i) {
    return '<span class="dot ' + (i === step ? 'active' : i < step ? 'done' : '') + '"></span>';
  }).join('') + '</div>';
}

function render() {
  const q = questions[step];
  card.innerHTML =
    '<div class="fade-in">' +
      '<div class="eyebrow">' + q.eyebrow + '</div>' +
      '<h1>' + q.title + '</h1>' +
      '<p class="sub">' + q.sub + '</p>' +
      dots() +
      '<div class="options">' +
        '<button class="btn btn-yes" id="yesBtn">Yes \u{1F497}</button>' +
        '<div class="no-wrap"><button class="btn btn-no" id="noBtn">No</button></div>' +
      '</div>' +
    '</div>';

  document.getElementById('yesBtn').addEventListener('click', next);

  const no = document.getElementById('noBtn');
  const flee = function(e) {
    if (e) e.preventDefault();
    const dx = (Math.random() - 0.5) * 220;
    const dy = (Math.random() - 0.5) * 120;
    no.style.transform = 'translate(calc(-50% + ' + dx + 'px), ' + dy + 'px)';
  };
  no.addEventListener('mouseover', flee);
  no.addEventListener('click', flee);
  no.addEventListener('touchstart', flee, { passive: false });
}

function next() {
  burst(6);
  step++;
  if (step < questions.length) render();
  else finale();
}

function finale() {
  card.innerHTML =
    '<div class="finale fade-in">' +
      '<div class="eyebrow">the results are in</div>' +
      '<div class="heart-big">\u{1F497}</div>' +
      '<h1>I <em>knew</em> it.</h1>' +
      '<p class="note">Every answer was yes \u2014 just like I hoped. ' +
      'You\'re my favorite person, and I\'m so lucky it\'s you.</p>' +
      '<button class="replay" onclick="restart()">\u21BA ask me again</button>' +
    '</div>';
  burst(28);
}

function restart() { step = 0; render(); }

function burst(n) {
  const set = ['\u{1F497}','\u{1F495}','\u{1F49E}','\u{1F338}','\u2728','\u{1F4AB}'];
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = set[Math.floor(Math.random() * set.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    h.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    document.body.appendChild(h);
    setTimeout(function() { h.remove(); }, 5200);
  }
}

render();
</script>
</body>
</html>
